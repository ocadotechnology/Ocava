# Runs the release build and uploads the bundle to Central for validation WITHOUT publishing it.
# Triggered by pushing a branch named release-dry-run/<anything>; the workflow file is taken from that branch,
# so it does not need to exist on master. A successful validation leaves the deployment in the Central Portal
# as "VALIDATED" - drop it from https://central.sonatype.com/publishing/deployments.
name: Release dry run

on:
  push:
    branches: [ 'release-dry-run/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      - shell: bash
        env:
          gpg_private_key: ${{ secrets.gpg_private_key }}
        run: |
          printf "%s" "$gpg_private_key" | gpg --import --batch --yes
      - name: Release build, upload to Central without publishing
        env:
          gpg_passphrase: ${{ secrets.gpg_passphrase }}
          central_login: ${{ secrets.central_login }}
          central_pass: ${{ secrets.central_pass }}
        run: |
          mvn -B versions:set -DprocessAllModules -DnewVersion="0.0.0-dry-run.${{ github.run_number }}"
          mvn -B -e -s .mvn/settings.xml -P release -Dcentral.autoPublish=false -DskipTests deploy --file pom.xml
      - name: Diagnose Central bundle
        if: always()
        run: |
          echo "--- staging tree ---"
          find "Bill of Materials/target/central-staging" -type f ! -name '*.md5' ! -name '*.sha*' | sort
          echo "--- bundle zip(s) ---"
          find . -name 'central-bundle.zip' -print -exec unzip -l {} \;
      - name: Upload Central bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: |
            Bill of Materials/target/central-publishing/
            Bill of Materials/target/central-staging/
          if-no-files-found: warn
